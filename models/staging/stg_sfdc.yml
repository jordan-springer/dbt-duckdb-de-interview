version: 2

models:
  - name: stg_sfdc__a_leads
    description: Staging for Salesforce LEAD (a-lead) — one row per person / customer
    columns:
      - name: lead_id
        description: Unique a-lead identifier
        data_tests:
          - unique
          - not_null
      - name: email
        description: Lead email address
        data_tests:
          - not_null
      - name: status
        description: Lead status
        data_tests:
          - accepted_values:
              values: ['Working', 'Converted', 'Closed Lost']

  - name: stg_sfdc__b_leads
    description: Staging for Salesforce BLEAD__C (b-lead) — one row per form submission (attribution / resubmission story)
    columns:
      - name: b_lead_id
        description: Unique b-lead / submission identifier
        data_tests:
          - unique
          - not_null
      - name: lead_id
        description: FK to a-lead
        data_tests:
          - not_null

  - name: stg_loan_milestones
    description: Staging for loan funnel milestone events
    columns:
      - name: lead_id
        description: FK to a-lead
        data_tests:
          - not_null
      - name: milestone_type
        description: Funnel milestone (lead, contact, opportunity, file_started, funded)
        data_tests:
          - not_null
          - accepted_values:
              values: ['lead', 'contact', 'opportunity', 'file_started', 'funded']
      - name: milestone_timestamp
        description: When the milestone occurred
        data_tests:
          - not_null

  - name: stg_marketing_spend
    description: Staging for daily campaign marketing spend
    columns:
      - name: spend_date
        description: Spend date
        data_tests:
          - not_null
      - name: campaign
        description: Campaign name
        data_tests:
          - not_null
      - name: channel
        description: Marketing channel
        data_tests:
          - not_null
          - accepted_values:
              values: ['Google', 'Bing', 'Purchased Leads']
      - name: cost
        description: Spend amount
        data_tests:
          - not_null
