version: 2

models:
  - name: dim_leads
    description: SCD Type 2 dimension for leads with conversion metrics
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - lead_id
              - valid_from
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - lead_id
          config:
            where: "is_current"
    columns:
      - name: lead_id
        description: Lead identifier (one row per version)
        data_tests:
          - not_null
      - name: valid_from
        description: Start of validity for this lead version
        data_tests:
          - not_null
      - name: is_current
        description: Whether this row is the current version for the lead
      - name: email
        description: Lead email address
        data_tests:
          - not_null

  - name: dim_campaigns
    description: Dimension table for campaigns with duration metrics
    columns:
      - name: campaign_id
        description: Unique campaign identifier
        data_tests:
          - unique
          - not_null

  - name: fct_campaign_members
    description: Fact table for campaign membership with lead and campaign context
    columns:
      - name: campaign_member_id
        description: Unique campaign member identifier
        data_tests:
          - unique
          - not_null
      - name: campaign_id
        description: Foreign key to campaigns
        data_tests:
          - not_null
      - name: lead_id
        description: Foreign key to leads
        data_tests:
          - not_null

  - name: mart_ab_lead_performance
    description: A/B experiment performance metrics by variant
    columns:
      - name: experiment_key
        description: Unique experiment identifier
        data_tests:
          - not_null
      - name: variant
        description: A/B test variant
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['A', 'B']
